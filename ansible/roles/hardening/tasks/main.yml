- name: Lock down SSH
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      MaxAuthTries 3
      X11Forwarding no
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

# allow rules before enabling the firewall, or you lock yourself out
- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow HTTP
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Enable firewall, deny everything else incoming
  community.general.ufw:
    state: enabled
    direction: incoming
    policy: deny

- name: Make sure fail2ban is running
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
