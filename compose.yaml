name: pulsecheck

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./app
    image: pulsecheck:local
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # no ports: only reachable through  nginx

  worker:
    build: ./app
    image: pulsecheck:local # same image as api
    command: ["python", "worker.py"] # diff process
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TICK_SECONDS: "10"
      CHECK_TIMEOUT_SECONDS: "10"
    healthcheck:
      # healthy if the worker loop touched its heartbeat file in the last 60s
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,sys,time; sys.exit(0) if time.time() - os.path.getmtime('/tmp/worker_heartbeat') < 60 else sys.exit(1)",
        ]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
    depends_on:
      api:
        condition: service_healthy # api creates the schema first
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
